<style>
/* ===== KoltukTr v3 — tek dosyalık uygulama stilleri ===== */
:root{
  --bg:#f3f0e9; --card:#fffdfa; --card2:#f7f3ea; --ink:#1d2523; --muted:#5b6965; --line:#e2dccf; --line2:#cdc5b4;
  --ok:#157a3c; --ok-bg:#e1f3e7; --warn:#935400; --warn-bg:#fcefd0; --bad:#b42318; --bad-bg:#fde8e6; --info:#1d4ed8; --info-bg:#e6edfd;
  --shadow:0 1px 2px rgba(30,40,35,.06),0 6px 18px rgba(30,40,35,.07);
  --ac:#0f766e; --ac-ink:#ffffff; --ac-soft:#d6efea; --ac-deep:#0a4a45;
  --overlay:rgba(18,24,22,.52);
  --r:16px; --gut:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-mode="hali"]{ --ac:#b4530b; --ac-ink:#ffffff; --ac-soft:#fbe5cf; --ac-deep:#7a3506; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121715; --card:#1b2321; --card2:#222b29; --ink:#edf2ef; --muted:#9fb0aa; --line:#2c3633; --line2:#3b4743;
--ok:#4ade80; --ok-bg:#12301f; --warn:#fbbf24; --warn-bg:#35280b; --bad:#ff8a80; --bad-bg:#3a1714; --info:#8ab4ff; --info-bg:#16233f;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
--ac:#3dd6c3; --ac-ink:#04231f; --ac-soft:#133530; --ac-deep:#0b3a35;
--overlay:rgba(0,0,0,.66); color-scheme:dark; }
  :root:not([data-theme="light"])[data-mode="hali"]{ --ac:#f2a24b; --ac-ink:#2c1600; --ac-soft:#3a2713; --ac-deep:#4a2a0e; }
}
:root[data-theme="dark"]{ --bg:#121715; --card:#1b2321; --card2:#222b29; --ink:#edf2ef; --muted:#9fb0aa; --line:#2c3633; --line2:#3b4743;
--ok:#4ade80; --ok-bg:#12301f; --warn:#fbbf24; --warn-bg:#35280b; --bad:#ff8a80; --bad-bg:#3a1714; --info:#8ab4ff; --info-bg:#16233f;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
--ac:#3dd6c3; --ac-ink:#04231f; --ac-soft:#133530; --ac-deep:#0b3a35;
--overlay:rgba(0,0,0,.66); color-scheme:dark; }
:root[data-theme="dark"][data-mode="hali"]{ --ac:#f2a24b; --ac-ink:#2c1600; --ac-soft:#3a2713; --ac-deep:#4a2a0e; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);min-height:100vh;overflow-x:hidden}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--ac);text-decoration:none}
small{color:var(--muted)}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Yerleşim ---------- */
.app{max-width:600px;margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));padding-bottom:150px}
.top{position:sticky;top:0;z-index:30;margin:0 calc(-1 * var(--gut));padding:calc(10px + env(safe-area-inset-top,0px)) var(--gut) 10px;background:var(--ac-deep);color:#fff;border-radius:0 0 22px 22px;box-shadow:var(--shadow)}
.top-r1{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;font-size:20px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.top-name{min-width:0;flex:1}
.top-name b{display:block;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-name span{font-size:12px;opacity:.82}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2);min-height:34px;max-width:46vw}
.chip-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-btn.ok{background:rgba(120,255,170,.18)}
.chip-btn.bad{background:rgba(255,120,110,.28)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;background:rgba(0,0,0,.22);padding:4px;border-radius:16px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border-radius:12px;color:rgba(255,255,255,.82);font-weight:800;font-size:14px;padding:0 8px}
.seg button em{font-style:normal;font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ac-deep);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.seg button[aria-pressed="true"] em{background:var(--ac-deep);color:#fff}
.area-note{margin:12px 0 0;padding:9px 12px;border-radius:12px;background:var(--ac-soft);color:var(--ac-deep);font-size:13px;font-weight:600}
:root[data-theme="dark"] .area-note,:root:not([data-theme="light"]) .area-note{color:var(--ink)}
.tab{padding-top:14px;display:flex;flex-direction:column;gap:12px}
.strip,.banner{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.strip{background:var(--info-bg);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner button,.strip button{margin-left:auto;font-weight:800;text-decoration:underline;color:inherit;flex:none;padding:2px 4px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(6px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:700;min-height:52px;position:relative}
.nav button[aria-current="page"]{color:var(--ac);background:var(--ac-soft)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:800}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ac);color:var(--ac-ink);font-weight:800;font-size:15px;padding:0 20px;min-height:52px;border-radius:26px;box-shadow:0 6px 20px rgba(0,0,0,.28);display:flex;align-items:center;gap:8px}
.fab b{font-size:22px;line-height:1;font-weight:700}

/* ---------- Genel bileşenler ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:2px}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.sec-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px -2px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:800;font-size:14px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);text-align:center;line-height:1.15}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.blk{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.ac{background:var(--ac-soft);border-color:transparent;color:var(--ac-deep)}
:root[data-theme="dark"] .chip.ac,:root:not([data-theme="light"]) .chip.ac{color:var(--ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none}
.pillbtn{padding:8px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line2);min-height:38px;white-space:nowrap}
.pillbtn[aria-pressed="true"],.pillbtn.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.pillbtn .cnt{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;padding:0 5px;margin-left:3px}
.pillbtn.full{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pillbtn.free{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.hint{display:flex;gap:10px;padding:11px 12px;border-radius:14px;background:var(--info-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--info) 22%,transparent);font-size:13.5px}
.hint .e{font-size:18px;line-height:1.2}
.hint p+p{margin-top:4px}
.hint button.close{margin-left:auto;color:var(--muted);font-size:16px;align-self:flex-start;padding:0 4px}
.empty{text-align:center;padding:26px 16px;border:2px dashed var(--line2);border-radius:var(--r);color:var(--muted)}
.empty .big{font-size:34px;line-height:1.1;margin-bottom:6px}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:4px}
.empty p{font-size:13.5px;max-width:34ch;margin:0 auto 12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.alert{padding:9px 11px;border-radius:12px;font-size:13px;font-weight:600}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.info{background:var(--info-bg);color:var(--info)}
.bar{height:10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;min-width:2px}
details.faq{border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:0 12px}
details.faq summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.faq summary::after{content:"＋";color:var(--muted)}
details.faq[open] summary::after{content:"－"}
details.faq summary::-webkit-details-marker{display:none}
details.faq .ans{padding:0 0 12px;font-size:14px;color:var(--ink)}
details.faq .ans p+p,details.faq .ans ol,details.faq .ans ul{margin-top:6px}
details.faq .ans ol,details.faq .ans ul{padding-left:20px}
details.faq .ans li{margin:3px 0}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--card2);border:1px solid var(--line);padding:1px 5px;border-radius:6px;word-break:break-all}
pre.code{white-space:pre-wrap;word-break:break-all;margin:6px 0 0;padding:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;font-size:12.5px}

/* ---------- Form alanları ---------- */
.f{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.f>span.l{display:block;margin-bottom:4px}
.f small{display:block;font-weight:500;margin-top:4px;font-size:12.5px;line-height:1.35}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=url],input[type=email],input[type=search],input[type=number],input:not([type]),select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;font-weight:500;appearance:none;-webkit-appearance:none;outline:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.fs{display:flex;flex-direction:column;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.fs:first-child{border-top:0;padding-top:0}
.fs>h3{font-size:14px;font-weight:800;color:var(--ac-deep)}
:root[data-theme="dark"] .fs>h3,:root:not([data-theme="light"]) .fs>h3{color:var(--ac)}
.with-btn{display:flex;gap:8px;align-items:stretch}
.with-btn>input,.with-btn>textarea{flex:1;min-width:0}
.with-btn>.btn{flex:none;padding:0 12px}
.searchbox{position:relative}
.searchbox input{padding-left:40px}
.searchbox::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7}

/* ---------- Günler şeridi ---------- */
.days{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr)) 34px;gap:4px;align-items:stretch}
.days .arr{border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:800;color:var(--muted)}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0;min-height:76px}
.day .w{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.day .n{font-size:18px;font-weight:900;line-height:1.1}
.day .dots{display:flex;gap:2px;height:7px;align-items:center;margin:1px 0}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--line2)}
.day .dots i.on{background:var(--ac)}
.day .r{font-size:9.5px;font-weight:800;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}
.day .r.off{color:var(--bad)}
.day.today .n{color:var(--ac)}
.day[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.day[aria-pressed="true"] .w,.day[aria-pressed="true"] .r,.day[aria-pressed="true"] .n,.day[aria-pressed="true"] .r.off{color:var(--ac-ink)}
.day[aria-pressed="true"] .dots i{background:rgba(255,255,255,.4)}
.day[aria-pressed="true"] .dots i.on{background:#fff}
.dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayhead h2{font-size:17px}
.quota{display:flex;gap:3px;align-items:center}
.quota i{width:14px;height:7px;border-radius:4px;background:var(--line2)}
.quota i.on{background:var(--ac)}
.quota i.over{background:var(--bad)}

.sum{background:linear-gradient(160deg,var(--ac-deep),color-mix(in srgb,var(--ac-deep) 70%,var(--ac)));color:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.sum h2{font-size:13px;font-weight:700;opacity:.85}
.sum .big{font-size:26px;font-weight:900;margin:2px 0 8px}
.sum .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum .mini div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 6px;text-align:center}
.sum .mini b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.sum .mini span{font-size:11px;opacity:.85}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tool{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;min-height:56px;position:relative}
.tool .e{font-size:22px}
.tool b{display:block;font-size:13.5px;line-height:1.15}
.tool small{display:block;font-size:11.5px;line-height:1.2;margin-top:2px}
.tool .cnt{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:800;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}

/* ---------- Randevu kartı ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.daysep{font-size:13px;font-weight:800;color:var(--ac-deep);padding:6px 2px 0}
:root[data-theme="dark"] .daysep,:root:not([data-theme="light"]) .daysep{color:var(--ac)}
.appt{position:relative;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}

.appt.due{border-left-color:var(--warn)}
.a-top{display:flex;gap:10px;align-items:flex-start}
.a-time{flex:none;text-align:center;min-width:50px}
.a-time b{display:block;font-size:19px;font-weight:900;line-height:1.1}

.a-main{flex:1;min-width:0}
.a-name{font-weight:800;font-size:16px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;word-break:break-word}
.a-svc{font-size:13.5px;color:var(--muted);margin-top:2px;word-break:break-word}
.a-price{flex:none;text-align:right}
.a-price b{display:block;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.a-price span{font-size:12px;font-weight:800}
.a-price .paid{color:var(--ok)} .a-price .due{color:var(--warn)}
.a-addr{font-size:13.5px;color:var(--ink);word-break:break-word}
.a-note{font-size:13px;background:var(--card2);border-radius:10px;padding:8px 10px;color:var(--ink);word-break:break-word}
.a-warn{font-size:12.5px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px}
.stages{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stages::-webkit-scrollbar{display:none}
.stages button{flex:none;padding:7px 10px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;font-weight:700;background:var(--card2);min-height:34px}

.photos{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}

.photos img{display:block;height:54px;width:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);margin-top:2px}
.a-act{display:grid;grid-template-columns:1fr 1fr 1.25fr auto;gap:6px;padding-top:2px}
.a-act .btn{min-height:42px;padding:0 6px;font-size:13px}
.a-act .more{width:46px;padding:0;font-size:20px;letter-spacing:1px}

/* ---------- Rota ---------- */
.stop{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.stop .acts{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}
.sortbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sortbar .pillbtn{padding:6px 4px;font-size:12.5px;border-radius:12px;line-height:1.2;white-space:normal;text-align:center;min-height:44px}
.stop:last-child{border-bottom:0}
.stop .no{width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;font-weight:900;flex:none}
.stop .no.x{background:var(--line2);color:var(--ink)}
.stop .info{flex:1;min-width:0}
.stop .info b{display:block;word-break:break-word}
.stop .info small{display:block;word-break:break-word}
.stop .km{text-align:right;font-weight:800;font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.stop .km small{display:block;font-weight:600}

/* ---------- Para ---------- */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}

.stat .pos{color:var(--ok)} .stat .neg{color:var(--bad)}
.line-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line-row:last-child{border-bottom:0}
.line-row .t{flex:1;min-width:0;word-break:break-word}
.line-row .t small{display:block}
.hbar{display:grid;grid-template-columns:minmax(70px,28%) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .bar{height:8px}

.cust{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* ---------- Sheet (alttan açılan pencere) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--overlay);animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:600px;max-height:94vh;max-height:94dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease;box-shadow:0 -10px 40px rgba(0,0,0,.3)}

.sheet-f .btn{flex:1}
.sheet-f .btn.pri{flex:2}

.menu{display:flex;flex-direction:column;gap:6px}

.mi b{display:block;font-size:14.5px}
.mi small{display:block;font-size:12.5px;line-height:1.25}
.mi.bad b{color:var(--bad)}

/* ---------- Hizmet satırları ---------- */
.line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.line.on{border-color:var(--ac);background:var(--ac-soft)}

.line .l-info b{display:block;font-size:14px;word-break:break-word}
.line .l-info span{font-size:12.5px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:12px;font-size:20px;font-weight:800;background:var(--card);border:1px solid var(--line2)}
.step button.plus{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.step output{min-width:30px;text-align:center;font-weight:900;font-size:16px}
.line .l-sub{grid-column:1/-1;font-size:12.5px;font-weight:800;color:var(--ac-deep);text-align:right}
:root[data-theme="dark"] .line .l-sub,:root:not([data-theme="light"]) .line .l-sub{color:var(--ac)}
.line .m2in{display:flex;align-items:center;gap:6px}
.line .m2in input{width:96px;min-height:42px;text-align:right;padding:6px 10px}
.line .m2in .btn{min-height:42px;padding:0 10px}
.calc{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card2);border:1px dashed var(--line2);border-radius:12px;padding:8px}
.calc input{width:74px;min-height:40px;padding:6px 8px}
.calc em{font-style:normal;font-weight:800}
.totalbar{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--ac-deep);color:#fff;border-radius:14px;padding:11px 14px;font-weight:800}
.totalbar b{font-size:20px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
canvas.pad{width:100%;height:auto;aspect-ratio:10/3;border:1px dashed var(--line2);border-radius:12px;background:#fff;touch-action:none;display:block}
.prev{display:block;max-height:90px;max-width:100%;border-radius:10px;margin-top:6px;border:1px solid var(--line2)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(142px + env(safe-area-inset-bottom,0px));z-index:200;max-width:min(92vw,520px);background:#18201e;color:#fff;border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center}
.toast button{color:#7fe7d8;font-weight:800;flex:none;text-decoration:underline;padding:4px}
.toast span{min-width:0;word-break:break-word}

/* ---------- Yazdırma (teklif PDF) ---------- */
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#111;font:14px/1.5 var(--font);padding:20px;background:#fff}
  #printArea table{width:100%;border-collapse:collapse;margin-top:12px}
  #printArea th,#printArea td{border-bottom:1px solid #ccc;padding:8px;text-align:left}
  #printArea .r{text-align:right}
  #printArea h1{font-size:22px;margin:0}
}
@media (min-width:640px){.sheet{border-radius:22px;margin-bottom:3vh}.nav{left:50%;right:auto;transform:translateX(-50%);width:600px;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}}
@media (max-width:360px){.a-act{grid-template-columns:1fr 1fr}.a-act .more{width:auto}.grid2{grid-template-columns:1fr}.tools{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      const hdr = etagBroken ? {} : { 'X-Firebase-ETag': 'true' };
      let res;
      try { res = await fbFetch(url, { headers: hdr }); }
      catch (e) { if (!etagBroken && e.name !== 'AbortError') { etagBroken = true; attempt--; continue; } throw e; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const etag = etagBroken ? null : res.headers.get('ETag');
      const data = await res.json();
      let changed = false;
      if (data && typeof data === 'object' && data.workspaces) {
        const remote = normalizeState(data, false);
        const before = JSON.stringify([S.workspaces, S.business, S.ustas, S.weeklyRegions, S.districts, S.quota]);
        const merged = mergeStates(S, remote);
        const keep = { mode: S.mode, activeUsta: S.activeUsta, start: S.start, cloud: S.cloud, ui: S.ui };
        S = Object.assign(merged, keep);
        changed = JSON.stringify([S.workspaces, S.business, S.ustas, S.weeklyRegions, S.districts, S.quota]) !== before;
      }
      const put = { method: 'PUT', body: JSON.stringify(syncPayload()), headers: { 'Content-Type': 'application/json' } };
      if (etag) put.headers['If-Match'] = etag;
      const pr = await fbFetch(url, put);
      if (pr.status === 412) { continue; } // başka cihaz araya girdi: yeniden birleştir
      if (!pr.ok) throw new Error('HTTP ' + pr.status);
      S.cloud.lastSync = Date.now(); S.cloud.lastError = '';
      saveNow();
      if (changed) render(); else renderSyncChip();
      if (manual) toast(changed ? '☁️ Eşitlendi — diğer cihazdaki değişiklikler getirildi.' : '☁️ Eşitlendi — her şey güncel.');
      ok = true;
      break;
    }
    if (!ok && !S.cloud.lastError) S.cloud.lastError = 'Eşitleme meşgul, biraz sonra tekrar denenecek.';
  } catch (e) {
    S.cloud.lastError = syncErrText(e);
    if (manual) toast('❌ Eşitlenemedi: ' + S.cloud.lastError);
    saveNow();
  } finally {
    syncBusy = false; renderSyncChip();
    if (syncAgain) { syncAgain = false; scheduleSync(1200); }
  }
  return ok;
}

/* ===== Adres → koordinat, mesafe ve "yakından uzağa" sıralama ===== */
let geoBusy = false;

function haversineKm(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
const kmTxt = km => km < 1 ? Math.round(km * 1000 / 10) * 10 + ' m' : (km < 10 ? (Math.round(km * 10) / 10) : Math.round(km)).toLocaleString('tr-TR') + ' km';
const hasStart = () => S.start.lat != null && S.start.lon != null;
const coordsOf = a => (a.lat != null && a.lon != null) ? { lat: a.lat, lon: a.lon } : null;
function distFromStart(a) { const c = coordsOf(a); return (c && hasStart()) ? haversineKm({ lat: S.start.lat, lon: S.start.lon }, c) : null; }

/** Google Haritalar bağlantısından koordinat okur (kısa bağlantılar okunamaz). */
function coordsFromUrl(u) {
  u = String(u || '');
  let m = /@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/.exec(u) || /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/.exec(u) || /[?&](?:q|ll|query|destination)=(-?\d{1,2}\.\d+)(?:,|%2C)(-?\d{1,3}\.\d+)/.exec(u);
  if (!m) return null;
  const lat = +m[1], lon = +m[2];
  return (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) ? { lat, lon } : null;
}
function cleanAddress(addr) {
  return String(addr || '').replace(/\b(no|daire|kat|d|blok|kapı)\s*[:.]?\s*\d+[\w/]*/gi, ' ').replace(/\b\d+\s*\/\s*\d+\b/g, ' ').replace(/\s+/g, ' ').trim();
}
function geoQueries(a) {
  const city = (S.business.city || 'Adana').trim() || 'Adana';
  const dist = (a.district || '').trim(), addr = (a.address || '').trim();
  const qs = [];
  if (addr) qs.push({ q: [addr, dist, city, 'Türkiye'].filter(Boolean).join(', '), level: 'adres' });
  const cl = cleanAddress(addr);
  if (cl && cl !== addr) qs.push({ q: [cl, dist, city, 'Türkiye'].filter(Boolean).join(', '), level: 'adres' });
  const mh = /([\p{L}\d.\- ]{2,40}?)\s+(mah(?:allesi)?\.?)(?=\s|,|$)/iu.exec(addr);
  if (mh) qs.push({ q: [mh[1].trim() + ' Mahallesi', dist, city, 'Türkiye'].filter(Boolean).join(', '), level: 'mahalle' });
  if (dist) qs.push({ q: [dist, city, 'Türkiye'].join(', '), level: 'ilçe' });
  return qs;
}
const geoSig = a => [a.address, a.district, S.business.city, a.locationUrl].join('|');
const needsGeo = a => !(a.geoQ === geoSig(a) && (a.lat != null || a.geoLevel === 'yok')) && !(coordsFromUrl(a.locationUrl));

async function nominatim(q) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 10000);
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=tr&accept-language=tr&q=' + encodeURIComponent(q);
    const r = await fetch(url, { signal: ctl.signal, headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (Array.isArray(j) && j[0] && isFinite(+j[0].lat) && isFinite(+j[0].lon)) return { lat: +j[0].lat, lon: +j[0].lon };
    return null;
  } finally { clearTimeout(t); }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/** Listedeki koordinatsız adresleri çözer. Ağ yoksa durur ve false döner. */
async function ensureGeo(list, onProgress) {
  if (geoBusy) return { ok: false, busy: true };
  geoBusy = true;
  let done = 0, netFail = false;
  try {
    const todo = list.filter(needsGeo);
    // 1) Haritalar bağlantısından ağsız çöz
    for (const a of list) {
      const c = coordsFromUrl(a.locationUrl);
      if (c && (a.lat !== c.lat || a.lon !== c.lon || a.geoQ !== geoSig(a))) { a.lat = c.lat; a.lon = c.lon; a.geoLevel = 'bağlantı'; a.geoQ = geoSig(a); stamp(a); }
    }
    let first = true;
    for (let i = 0; i < todo.length; i++) {
      const a = todo[i];
      if (!first) await sleep(1100); // Nominatim kuralı: saniyede en fazla 1 istek
      first = false;
      if (onProgress) onProgress(i + 1, todo.length);
      const qs = geoQueries(a);
      let found = null, level = 'yok';
      try {
        for (const q of qs) {
          found = await nominatim(q.q);
          if (found) { level = q.level; break; }
          await sleep(1100);
        }
      } catch (e) { netFail = true; break; }
      a.geoQ = geoSig(a); a.lat = found ? found.lat : null; a.lon = found ? found.lon : null; a.geoLevel = found ? level : 'yok';
      stamp(a); done++;
    }
  } finally { geoBusy = false; }
  saveNow();
  if (typeof scheduleSync === 'function') scheduleSync();
  return { ok: !netFail, done };
}

/** mode: time | near | far. Çok günlü listede önce gün, sonra mesafe. */
function sortAppts(list, mode) {
  const byTime = sortByTime(list);
  if (mode === 'time' || !hasStart()) return byTime;
  const groups = new Map();
  for (const a of byTime) { if (!groups.has(a.date)) groups.set(a.date, []); groups.get(a.date).push(a); }
  const out = [];
  for (const g of groups.values()) {
    const withD = g.map(a => ({ a, d: distFromStart(a) }));
    const known = withD.filter(x => x.d != null).sort((x, y) => mode === 'near' ? x.d - y.d : y.d - x.d);
    const unknown = withD.filter(x => x.d == null);
    for (const x of known.concat(unknown)) out.push(x.a);
  }
  return out;
}
function routeKm(list) {
  if (!hasStart()) return null;
  let cur = { lat: S.start.lat, lon: S.start.lon }, km = 0, n = 0;
  for (const a of list) { const c = coordsOf(a); if (!c) continue; km += haversineKm(cur, c); cur = c; n++; }
  return n ? km : null;
}
function geoBadge(a) {
  if (a.geoLevel === 'yok') return '<span class="chip warn">📍 Adres bulunamadı</span>';
  const d = distFromStart(a);
  if (d == null) return '';
  const approx = a.geoLevel === 'ilçe' ? ' (ilçe merkezi)' : a.geoLevel === 'mahalle' ? ' (mahalle)' : '';
  return `<span class="chip info" title="Kuş uçuşu mesafe">📏 ${kmTxt(d)}${approx}</span>`;
}

/* ---------- Telefon konumu ---------- */
function getGps() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 'yok' });
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
      e => reject({ code: e && e.code === 1 ? 'izin' : (e && e.code === 3 ? 'zaman' : 'hata') }),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  });
}

}

function periodTest(p) {
  const t = today(), ym = monthOf(t);
  const pm = (() => { const d = parseIso(t); d.setDate(1); d.setMonth(d.getMonth() - 1); return monthOf(isoOf(d)); })();
  if (p === 'all') return () => true;
  const target = p === 'prev' ? pm : ym;
  return iso => monthOf(iso) === target;
}
function finStats(w, p) {
  const inP = periodTest(p), r = { gross: 0, cash: 0, iban: 0, card: 0, exp: 0, pendSum: 0, pendN: 0, dist: {}, ustaRev: {} };
  for (const a of w.appointments) {
    if (a.paid) {
      if (!inP(paidDate(a))) continue;
      r.gross += a.price;
      if (a.paymentMethod === 'IBAN') r.iban += a.price; else if (a.paymentMethod === 'Kart') r.card += a.price; else r.cash += a.price;
      const dn = a.district || 'Diğer'; r.dist[dn] = (r.dist[dn] || 0) + a.price;
      if (a.usta) { const u = r.ustaRev[a.usta] || (r.ustaRev[a.usta] = { n: 0, rev: 0 }); u.n++; u.rev += a.price; }
    } else { r.pendSum += a.price; r.pendN++; }
  }
  for (const e of w.expenses) if (inP(e.date)) r.exp += e.amount;
  r.net = r.gross - r.exp;
  return r;
}

function dueCustomers(w) {
  const t = today(), map = new Map();
  for (const a of w.appointments) {
    const k = custKey(a.phone, a.customerName), o = map.get(k);
    if (!o || a.date > o.date) map.set(k, a);
  }
  return Array.from(map.values()).filter(a => daysBetween(a.date, t) >= DUE_DAYS && !isBlack(w, a)).sort((a, b) => a.date.localeCompare(b.date));
}

  let o = path.startsWith('ws.') ? ws() : S;
  const ks = path.startsWith('ws.') ? parts.slice(1) : parts;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];

/* ---------- Hizmet satırı düzenleyici (adet: +/−, halı: m²) ---------- */
function calcLines(w, lines) {
  let total = 0, m2 = 0; const parts = [];
  for (const s of w.services) {
    const q = num(lines[s.id]);
    if (!(q > 0)) continue;
    total += q * s.price;
    if (s.unit === 'm2') { m2 += q; parts.push(fmtNum(q) + ' m² ' + s.name); } else parts.push(q + '× ' + s.name);
  }
  return { total: Math.round(total), m2: r1(m2), text: parts.join(', ') };
}
function itemsToLines(w, ap) {
  const lines = {};
  if (!ap) return lines;
  if (ap.serviceItems && ap.serviceItems.length) {
    const legacyHali = ap.sv !== 3 && S.mode === 'hali';
    let firstM2 = true;
    for (const it of ap.serviceItems) {
      const s = w.services.find(x => x.id === it.id) || w.services.find(x => x.name === it.name);
      if (!s) continue;
      if (legacyHali && s.unit === 'm2') { lines[s.id] = firstM2 ? (ap.carpetM2 || it.qty) : 0; firstM2 = false; if (!lines[s.id]) delete lines[s.id]; }
      else lines[s.id] = it.qty;
    }
    return lines;
  }
  for (const seg of String(ap.servicesText || '').split(',').map(x => x.trim()).filter(Boolean)) {
    const m = seg.match(/^(\d+(?:[.,]\d+)?)\s*[xX×]\s*(.+)$/);
    const q = m ? num(m[1]) : 1, nm = (m ? m[2] : seg).trim().toLowerCase();
    const s = w.services.find(x => x.name.toLowerCase() === nm || nm.includes(x.name.toLowerCase()));
    if (s) lines[s.id] = q;
  }
  return lines;
}
function leRowSub(s, q) {
  if (!(q > 0)) return '';
  return s.unit === 'm2' ? `${fmtNum(q)} m² × ${money(s.price)} = ${money(q * s.price)}` : `${q} × ${money(s.price)} = ${money(q * s.price)}`;
}
function leHtml(w, lines) {
  if (!w.services.length) return '<div class="alert warn">Fiyat listesi boş. Ayarlar → fiyat listesinden hizmet ekleyin ya da tutarı elle yazın.</div>';
  return w.services.map(s => {
    const q = num(lines[s.id]), on = q > 0, id = esc(s.id);
    const ctl = s.unit === 'm2'
      ? `<div class="m2in"><input type="text" inputmode="decimal" data-m2="${id}" value="${on ? esc(fmtNum(q).replace(/\./g, '')) : ''}" placeholder="0" aria-label="${esc(s.name)} metrekare"><span>m²</span><button class="btn" type="button" data-calc="${id}" aria-label="En çarpı boy hesapla">📐</button></div>`
      : `<div class="step"><button type="button" data-minus="${id}" aria-label="Azalt">−</button><output>${q || 0}</output><button class="plus" type="button" data-plus="${id}" aria-label="Arttır">+</button></div>`;
    return `<div class="line ${on ? 'on' : ''}" data-line="${id}"><div class="l-info"><b>${esc(s.name)}</b><span>${money(s.price)} / ${s.unit === 'm2' ? 'm²' : 'adet'}</span></div><div class="l-ctl">${ctl}</div>
      <div class="l-sub" ${on ? '' : 'hidden'}>${esc(leRowSub(s, q))}</div>
      ${s.unit === 'm2' ? `<div class="calc" hidden>En <input type="text" inputmode="decimal" data-cw aria-label="En (metre)"> <em>×</em> Boy <input type="text" inputmode="decimal" data-cl aria-label="Boy (metre)"> <span class="chip" data-cres>= 0 m²</span> <button class="btn sm pri" type="button" data-calc-add="${id}">Ekle</button></div>` : ''}</div>`;
  }).join('');
}
function leMount(root, w, lines, onChange) {
  const upd = id => {
    const s = w.services.find(x => x.id === id), row = $(`[data-line="${CSS.escape(id)}"]`, root);
    if (!s || !row) return;
    const q = num(lines[id]);
    row.classList.toggle('on', q > 0);
    const sub = $('.l-sub', row); sub.hidden = !(q > 0); sub.textContent = leRowSub(s, q);
    const out = $('output', row); if (out) out.textContent = q || 0;
    onChange();
  };
  root.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !root.contains(b)) return;
    if (b.dataset.plus) { lines[b.dataset.plus] = Math.min(99, num(lines[b.dataset.plus]) + 1); upd(b.dataset.plus); }
    else if (b.dataset.minus) { const q = Math.max(0, num(lines[b.dataset.minus]) - 1); if (q) lines[b.dataset.minus] = q; else delete lines[b.dataset.minus]; upd(b.dataset.minus); }
    else if (b.dataset.calc) { const c = $('.calc', b.closest('.line')); c.hidden = !c.hidden; if (!c.hidden) $('[data-cw]', c).focus(); }
    else if (b.dataset.calcAdd) {
      const row = b.closest('.line'), id = b.dataset.calcAdd, add = r1(num($('[data-cw]', row).value) * num($('[data-cl]', row).value));
      if (!(add > 0)) { toast('En ve boyu metre olarak yazın (ör. 2 ve 3)'); return; }
      lines[id] = r1(num(lines[id]) + add);
      $('[data-m2]', row).value = fmtNum(lines[id]).replace(/\./g, '');
      $('[data-cw]', row).value = ''; $('[data-cl]', row).value = ''; $('[data-cres]', row).textContent = '= 0 m²'; $('.calc', row).hidden = true;
      upd(id); toast('+' + fmtNum(add) + ' m² eklendi');
    }
  });
  root.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.m2) { const q = Math.max(0, num(t.value)); if (q > 0) lines[t.dataset.m2] = Math.min(q, 100000); else delete lines[t.dataset.m2]; upd(t.dataset.m2); }
    else if (t.hasAttribute('data-cw') || t.hasAttribute('data-cl')) { const row = t.closest('.calc'); $('[data-cres]', row).textContent = '= ' + fmtNum(num($('[data-cw]', row).value) * num($('[data-cl]', row).value)) + ' m²'; }
  });
}

/* ---------- Randevu / halı fişi formu ---------- */
function readPhoto(file) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = () => rej(new Error('okunamadı'));
    rd.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('görsel değil'));
      img.onload = () => {
        const sc = Math.min(1, 480 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.62));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
function dictate(el) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('🎙️ Klavyenizdeki mikrofon simgesine basarak sesle yazabilirsiniz.'); el.focus(); return; }
  try {
    const r = new SR(); r.lang = 'tr-TR'; r.interimResults = false;
    r.onresult = ev => { const t = ev.results[0][0].transcript; el.value = el.value ? el.value + ' ' + t : t; el.dispatchEvent(new Event('input', { bubbles: true })); toast('✅ Ses yazıya çevrildi'); };
    r.onerror = () => toast('⚠️ Ses algılanamadı, tekrar deneyin.');
    toast('🎙️ Dinliyorum, konuşun…'); r.start();
  } catch (e) { toast('Mikrofon başlatılamadı.'); }
}

      const bl = () => {

      };

      });

        const f = inp.files && inp.files[0]; if (!f) return;
        try { const d = await readPhoto(f); photos[inp.dataset.photo] = d; const pv = $(`[data-prev="${inp.dataset.photo}"]`, el); pv.src = d; pv.hidden = false; } catch (e) { toast('⚠️ Fotoğraf okunamadı.'); }
      }));
      const cv = F('sig'), cx = cv.getContext('2d'); let drawing = false;
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.strokeStyle = '#0f172a'; cx.lineWidth = 3; cx.lineCap = 'round'; cx.lineJoin = 'round';
      const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
      cv.addEventListener('pointerdown', e => { drawing = true; try { cv.setPointerCapture(e.pointerId); } catch (x) { /* */ } const p = pos(e); cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x + .1, p.y + .1); cx.stroke(); sigDirty = true; dirty = true; e.preventDefault(); });
      cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); cx.lineTo(p.x, p.y); cx.stroke(); e.preventDefault(); });
      ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { drawing = false; }));
      $('[data-sigclear]', el).addEventListener('click', () => { cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); sigDirty = false; sig = ''; const sp = F('sigprev'); if (sp) sp.remove(); dirty = true; });
      refresh();
      $('#apptSave', el).addEventListener('click', () => saveApptForm(sh, ex, F, lines, () => priceManual, photos, () => sigDirty ? cv.toDataURL('image/png') : sig));
      setTimeout(() => { try { if (!ex) F('name').focus(); } catch (e) { /* */ } }, 250);
    }
  });
}
function saveApptForm(sh, ex, F, lines, getManual, photos, getSig) {
  const w = ws(), h = isHali();
  const name = F('name').value.trim(), date = F('date').value, time = F('time').value || '09:00';
  if (!name) { toast('⚠️ Müşteri adını yazın.'); F('name').focus(); return; }
  if (!isoValid(date)) { toast('⚠️ Geçerli bir gün seçin.'); F('date').focus(); return; }
  const calc = calcLines(w, lines), price = Math.max(0, num(F('price').value));
  const warns = [];
  const others = w.appointments.filter(a => a.date === date && (!ex || a.id !== ex.id));
  if (others.length >= S.quota && !(ex && ex.date === date)) warns.push(`${longDate(date)} günü zaten ${others.length} kayıt var (günlük kota ${S.quota}).`);
  if (!h && others.some(a => a.time === time)) warns.push(`Aynı gün saat ${time} için başka bir randevu var.`);
  const go = () => {
    const phone = F('phone').value.trim(), district = F('district').value.trim(), address = F('address').value.trim(), url = safeUrl(F('url').value);
    const bl = F('black').checked, paid = F('paid').value === '1';
    const rec = normAppt(Object.assign({}, ex || {}, {
      id: ex ? ex.id : uid('apt'), customerName: name, phone, date, time, district, address, locationUrl: url,
      materialType: F('mat').value, serviceItems: w.services.filter(s => num(lines[s.id]) > 0).map(s => ({ id: s.id, name: s.name, price: s.price, qty: num(lines[s.id]), unit: s.unit })),
      servicesText: calc.text, price, paymentMethod: F('pay').value, paid, status: ex ? ex.status : 'PENDING',
      notes: F('notes').value.trim(), blacklisted: bl, beforePhoto: photos.before, afterPhoto: photos.after, signatureData: getSig(),
      usta: ex ? ex.usta : S.activeUsta, receiptNo: ex ? ex.receiptNo : (h ? nextReceipt(w) : ''),
      carpetM2: calc.m2, carpetCount: h ? Math.round(num(F('count').value)) : 0, carpetStage: h ? F('stage').value : '',
      sv: 3, priceManual: getManual(), machineCounted: ex ? ex.machineCounted : false, paidAt: ex ? ex.paidAt : '', demo: ex ? ex.demo : false
    }), S.mode);
    if (paid && !rec.paidAt) rec.paidAt = today(); if (!paid) rec.paidAt = '';
    if (h && rec.carpetStage === 'TESLIM_EDILDI' && rec.status !== 'DONE') { rec.status = 'DONE'; if (!rec.machineCounted) { w.machineCounter++; rec.machineCounted = true; } }
    if (!ex || geoSig(ex) !== geoSig(rec)) { rec.lat = null; rec.lon = null; rec.geoQ = ''; rec.geoLevel = ''; }
    stamp(rec);
    if (ex) w.appointments[w.appointments.findIndex(a => a.id === ex.id)] = rec; else w.appointments.push(rec);
    let c = findCust(w, phone, name);
    if (!c) { c = normCust({ name, phone, district, address, blacklisted: bl }); w.customers.push(c); }
    else { if (phone) { c.phone = phone; if (ex && c.name === ex.customerName) c.name = name; } if (district) c.district = district; if (address) c.address = address; c.blacklisted = bl; }
    stamp(c);
    S.ui.date = date; S.ui.showAll = false; Q = '';
    commit(); closeSheet(sh);
    toast(ex ? '✅ Kayıt güncellendi' : (h ? '✅ Halı fişi kaydedildi' : '✅ Randevu kaydedildi'));
  };
  if (warns.length) confirmSheet({ title: 'Uyarı', msg: warns.join(' ') + ' Yine de kaydedilsin mi?', ok: 'Evet, kaydet', onOk: go }); else go();
}

/* ---------- Kayıt işlemleri ---------- */
function setStage(id, code) {
  const a = findAppt(id); if (!a) return;
  if (code === 'TESLIM_EDILDI') { completeAppt(id, code); return; }
  a.carpetStage = code; if (a.status === 'DONE') a.status = 'PENDING';
  stamp(a); commit();
  const s = STAGES.find(x => x.code === code); toast('🧶 Durum: ' + (s ? s.label : code));
}
function markDone(a, paid) {
  const w = ws();
  a.status = 'DONE';
  if (paid && !a.paid) { a.paid = true; a.paidAt = today(); }
  if (isHali()) a.carpetStage = 'TESLIM_EDILDI';
  if (!a.machineCounted) { w.machineCounter++; a.machineCounted = true; w.setAt = Date.now(); }
  stamp(a); commit();
  toast(a.paid ? '✅ Tamamlandı ve tahsil edildi' : '✅ Tamamlandı — ödeme alacak olarak kaldı');
}
function completeAppt(id) {
  const a = findAppt(id); if (!a) return;
  if (a.status === 'DONE') {
    a.status = 'PENDING'; if (isHali() && a.carpetStage === 'TESLIM_EDILDI') a.carpetStage = 'DAGITIMDA';
    stamp(a); commit(); toast('↩ Bekleyene alındı (ödeme durumu değişmedi)'); return;
  }
  if (a.paid) { markDone(a, true); return; }
  confirmSheet({ title: 'Ödeme alındı mı?', msg: `${a.customerName}: ${money(a.price)} tutarı tahsil edildi mi?`, buttons: [{ label: 'Hayır, alacak kalsın', cls: '', fn: () => markDone(a, false) }, { label: 'Evet, tahsil edildi', cls: 'ok', fn: () => markDone(a, true) }], cancel: 'Vazgeç' });
}
function markPaid(id) {
  const a = findAppt(id); if (!a) return;
  a.paid = true; a.paidAt = today(); stamp(a); commit(); toast('💰 Tahsilat kaydedildi');
}
function delAppt(id) {
  const w = ws(), i = w.appointments.findIndex(a => a.id === id); if (i < 0) return;
  const rec = w.appointments[i]; w.appointments.splice(i, 1); w.deleted[id] = Date.now(); commit();
  toast('🗑️ Kayıt silindi', { undo: () => { delete w.deleted[id]; stamp(rec); w.appointments.push(rec); commit(); toast('↩ Kayıt geri getirildi'); } });
}
function toggleTimer(id) {
  const a = findAppt(id); if (!a) return;
  if (!a.timerStartedAt) { a.timerStartedAt = Date.now(); stamp(a); commit(); toast('⏱️ Süre ölçer başladı'); }
  else { const m = Math.max(1, Math.round((Date.now() - a.timerStartedAt) / 60000)); a.durationMinutes += m; a.timerStartedAt = null; stamp(a); commit(); toast(`✅ İş süresi kaydedildi: ${a.durationMinutes} dk`); }
}

const vEsc = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\r?\n/g, '\\n');
function saveVcf(name, phone, district) {
  const tag = isHali() ? 'Halı' : 'Koltuk', title = `${name || 'Müşteri'} - ${district || S.business.city || ''} (${tag})`.trim();
  const v = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + vEsc(title), 'N:' + vEsc(name || 'Müşteri') + ';;;;', 'TEL;TYPE=CELL:' + vEsc(phone), 'NOTE:' + vEsc(BN() + ' ' + tag + ' müşterisi'), 'END:VCARD'].join('\r\n');
  saveFile((name || 'musteri').replace(/[^\p{L}\p{N}]+/gu, '_') + '.vcf', 'text/vcard;charset=utf-8', v);

/* ---------- Story kolajı ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function drawCover(c, img, x, y, w, h) {
  const r = Math.max(w / img.width, h / img.height), sw = w / r, sh = h / r;
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h); c.restore();
}
async function makeCollage(a) {
  if (!a.beforePhoto || !a.afterPhoto) { toast('Kolaj için hem öncesi hem sonrası fotoğrafı gerekli.'); return; }
  try {
    const [b, f] = await Promise.all([loadImg(a.beforePhoto), loadImg(a.afterPhoto)]);
    const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1920; const c = cv.getContext('2d');
    const font = 'system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';
    c.fillStyle = '#0b1210'; c.fillRect(0, 0, 1080, 1920);
    c.fillStyle = '#0f766e'; c.fillRect(0, 0, 1080, 170);
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = `900 46px ${font}`; c.fillText(BN().toUpperCase().slice(0, 34), 540, 80);
    c.font = `bold 32px ${font}`; c.fillStyle = '#ccfbf1'; c.fillText(`${S.business.phone}${a.district ? ' • ' + a.district : ''}`, 540, 135);
    drawCover(c, b, 40, 200, 1000, 760); drawCover(c, f, 40, 1000, 1000, 760);
    c.fillStyle = 'rgba(225,29,72,.92)'; c.fillRect(60, 220, 260, 68); c.fillStyle = '#fff'; c.font = `900 34px ${font}`; c.fillText('ÖNCESİ', 190, 266);
    c.fillStyle = 'rgba(16,185,129,.94)'; c.fillRect(60, 1020, 280, 68); c.fillStyle = '#fff'; c.fillText('SONRASI ✨', 200, 1066);
    c.fillStyle = '#f8fafc'; c.font = `bold 30px ${font}`; c.fillText('Derinlemesine buharlı temizlik', 540, 1845);
    const url = cv.toDataURL('image/jpeg', 0.9), fname = 'story_' + (a.customerName || 'musteri').replace(/[^\p{L}\p{N}]+/gu, '_') + '.jpg';
    if (PREVIEW) { openSheet({ title: '📸 Story kolajı', body: `<img src="${url}" alt="Kolaj" style="width:100%;border-radius:12px"><p class="sub" style="margin-top:8px;color:var(--muted)">Görsele uzun basıp kaydedebilirsiniz.</p>` }); return; }
    try {
      const blob = await (await fetch(url)).blob(), file = new File([blob], fname, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const l = document.createElement('a'); l.href = url; l.download = fname; document.body.appendChild(l); l.click(); l.remove(); toast('📸 Kolaj indirildi');
  } catch (e) { logErr('collage', e); toast('Kolaj hazırlanamadı.'); }
}

function backupText() {
  return JSON.stringify({ app: 'KoltukTr', version: VERSION, exportedAt: new Date().toISOString(), data: { schema: 3, mode: S.mode, updatedAt: S.updatedAt, setAt: S.setAt, business: S.business, districts: S.districts, weeklyRegions: S.weeklyRegions, quota: S.quota, ustas: S.ustas, activeUsta: S.activeUsta, ustaCommissionPct: S.ustaCommissionPct, workspaces: S.workspaces } }, null, 1);
}
function snapshotBefore() { try { lsSet(KEY + '_oncesi', JSON.stringify(S)); } catch (e) { /* */ } }
const keepLocal = () => ({ mode: S.mode, activeUsta: S.activeUsta, start: S.start, cloud: S.cloud, ui: S.ui });
function importBackupText(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) { toast('❌ Geçersiz yedek: dosya okunamadı.'); return; }
  const src = raw && raw.data && typeof raw.data === 'object' ? raw.data : raw;
  if (!src || typeof src !== 'object' || !(src.workspaces || Array.isArray(src.appointments))) { toast('❌ Bu dosya KoltukTr yedeğine benzemiyor.'); return; }
  const imp = normalizeState(src, false);
  const nk = imp.workspaces.koltuk, nh = imp.workspaces.hali;
  const cnt = `Koltuk: ${nk.appointments.length} randevu, ${nk.customers.length} müşteri\nHalı: ${nh.appointments.length} fiş, ${nh.customers.length} müşteri`;
  if (!nk.appointments.length && !nh.appointments.length && !nk.customers.length && !nh.customers.length) { toast('Yedekte kayıt bulunamadı.'); return; }
  confirmSheet({
    title: 'Yedek bulundu', msg: cnt + '\n\nNasıl yüklensin?', cancel: 'Vazgeç',
    buttons: [
      { label: 'Mevcutlarla birleştir', cls: 'pri', fn: () => {
        snapshotBefore();
        for (const m of ['koltuk', 'hali']) { // yedekteki kayıtlar, daha önce silinmiş olsa bile geri gelsin
          const L = S.workspaces[m], R = imp.workspaces[m];
          for (const r of R.appointments.concat(R.customers, R.expenses)) if (L.deleted[r.id]) { delete L.deleted[r.id]; r.updatedAt = Date.now(); }
        }
        S = Object.assign(mergeStates(S, imp), keepLocal()); S.updatedAt = Date.now(); commit(); toast('✅ Yedek birleştirildi'); } },
      { label: 'Hepsini bununla değiştir', cls: 'bad', fn: () => {
        snapshotBefore();
        const old = S;
        S = Object.assign(imp, keepLocal());
        for (const m of ['koltuk', 'hali']) {
          const o = old.workspaces[m], n = S.workspaces[m], ids = new Set(n.appointments.concat(n.customers, n.expenses).map(r => r.id));
          for (const r of o.appointments.concat(o.customers, o.expenses)) if (!ids.has(r.id)) n.deleted[r.id] = Date.now();
          n.setAt = Date.now();
        }
        S.updatedAt = S.setAt = Date.now(); commit(); toast('✅ Yedek yüklendi');
      } }
    ]
  });
}

function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  const rows = [['Tarih', 'Saat', 'Müşteri', 'Telefon', 'İlçe', 'Adres', 'Hizmet', 'Alan (m²)', 'Tutar (TL)', 'Ödeme türü', 'Tahsilat', 'Durum', 'Usta', 'Fiş no']];

  'wa-next': el => { const a = findAppt(el.dataset.id); if (a) waNext(a); },
  'wa-neighbor': el => { const a = findAppt(el.dataset.id); if (a) waNeighbor(a); },
  'rota-day': el => { const n = +el.dataset.v; S.ui.date = addDays(S.ui.date, n); S.ui.stripStart = addDays(S.ui.date, -1); commit({ noStamp: true, noSync: true }); },
  'route-open': () => { const l = sortAppts(dayAppts(ws(), S.ui.date), S.ui.sort[S.mode]); if (l.length) openUrl(routeUrl(l)); },
  'fin-period': el => { S.ui.finPeriod = el.dataset.v; commit({ noStamp: true, noSync: true }); },
  'exp-add': () => {
    const amt = num($('#expAmt').value); if (!(amt > 0)) { toast('⚠️ Gider tutarını yazın.'); return; }
    ws().expenses.push(stamp(normExp({ category: $('#expCat').value, amount: amt, note: $('#expNote').value.trim() })));
    commit(); toast('⛽ Gider kaydedildi');
  },
  'exp-del': el => {
    const w = ws(), i = w.expenses.findIndex(e => e.id === el.dataset.id); if (i < 0) return;
    const rec = w.expenses[i]; w.expenses.splice(i, 1); w.deleted[rec.id] = Date.now(); commit();
    toast('🗑️ Gider silindi', { undo: () => { delete w.deleted[rec.id]; stamp(rec); w.expenses.push(rec); commit(); } });
  },
  'machine-reset': () => { ws().machineCounter = 0; ws().setAt = Date.now(); commit(); toast('🔧 Bakım sayacı sıfırlandı'); },
  'csv': () => exportCsv(),
  'c-wa': el => { const c = ws().customers.find(x => x.id === el.dataset.id); if (c) sendWa(c.phone, `Merhaba ${c.name}, `); },
  'c-vcf': el => { const c = ws().customers.find(x => x.id === el.dataset.id); if (c) saveVcf(c.name, c.phone, c.district); },
  'c-black': el => { const c = ws().customers.find(x => x.id === el.dataset.id); if (!c) return; c.blacklisted = !c.blacklisted; stamp(c); commit(); toast(c.blacklisted ? '⛔ Kara listeye alındı' : 'Kara listeden çıkarıldı'); },
  'c-del': el => {
    const w = ws(), i = w.customers.findIndex(c => c.id === el.dataset.id); if (i < 0) return;
    const rec = w.customers[i]; w.customers.splice(i, 1); w.deleted[rec.id] = Date.now(); commit();
    toast('🗑️ Müşteri silindi (randevuları durur)', { undo: () => { delete w.deleted[rec.id]; stamp(rec); w.customers.push(rec); commit(); } });
  },
  'theme': el => { S.ui.theme = el.dataset.v; commit({ noStamp: true, noSync: true }); },
  'svc-add': () => {
    const name = $('#newSvcName').value.trim(), price = num($('#newSvcPrice').value), u = $('#newSvcUnit');
    if (!name || !(price > 0)) { toast('⚠️ Hizmet adı ve fiyatı yazın.'); return; }
    ws().services.push({ id: uid('srv'), name: name.slice(0, 80), price, unit: u ? u.value : 'adet' }); ws().setAt = Date.now(); commit(); toast('✅ Hizmet eklendi');
  },
  'svc-del': el => {
    const w = ws(), i = w.services.findIndex(s => s.id === el.dataset.id); if (i < 0) return;
    const rec = w.services[i]; w.services.splice(i, 1); w.setAt = Date.now(); commit();
    toast('🗑️ Hizmet silindi', { undo: () => { w.services.splice(Math.min(i, w.services.length), 0, rec); w.setAt = Date.now(); commit(); } });
  },
  'dist-add': () => { const v = $('#newDist').value.trim().slice(0, 40); if (!v || v === 'Kapalı' || S.districts.includes(v)) return; S.districts.push(v); S.setAt = Date.now(); commit(); },
  'dist-del': el => { S.districts = S.districts.filter(d => d !== el.dataset.v); S.setAt = Date.now(); commit(); },
  'usta-del': el => { S.ustas = S.ustas.filter(u => u.name !== el.dataset.v); if (S.activeUsta === el.dataset.v) S.activeUsta = ''; S.setAt = Date.now(); commit(); },
  'team-gen': () => { $('#fbTeam').value = randomTeamCode(); toast('Yeni ekip kodu üretildi. Diğer telefonda da aynısını yazın.', { ms: 4500 }); },
  'cloud-save': () => {
    const url = $('#fbUrl').value.trim(), mail = $('#fbMail').value.trim();
    let team = $('#fbTeam').value.trim();
    const prev = S.cloud.firebaseUrl; S.cloud.firebaseUrl = url;
    if (url && !cloudBase()) { S.cloud.firebaseUrl = prev; toast('❌ Adres https:// ile başlayıp .firebaseio.com veya .firebasedatabase.app ile bitmeli.', { ms: 5000 }); return; }
    if (url && !team) team = randomTeamCode();
    S.cloud.teamCode = team.toUpperCase(); S.cloud.email = mail; S.cloud.lastError = '';
    commit({ noStamp: true, noSync: true });
    if (!url) { toast('Bulut eşitleme kapatıldı.'); return; }
    if (S.cloud.teamCode.replace(/[^A-Z0-9]/g, '').length < 6) { toast('Ekip kodu en az 6 harf/rakam olmalı.'); return; }
    syncNow(true);
  },
  'cloud-sync': () => syncNow(true),
  'backup-download': () => { S.ui.lastBackup = Date.now(); commit({ noStamp: true, noSync: true }); saveFile(`koltuktr_yedek_${today()}.json`, 'application/json', backupText()); },
  'backup-copy': () => { S.ui.lastBackup = Date.now(); commit({ noStamp: true, noSync: true }); copyText(backupText(), '📋 Yedek kopyalandı. Bir nota yapıştırıp saklayabilirsiniz.'); },
  'backup-file': () => { const f = $('#backupFile'); f.value = ''; f.click(); },
  'backup-paste': () => openPasteBackup(),
  'show-welcome': () => openWelcome(),
  'demo-clear': () => confirmSheet({ title: 'Örnek kayıtlar silinsin mi?', msg: 'Yalnızca “(örnek)” işaretli kayıtlar silinir.', ok: 'Sil', danger: true, onOk: () => { for (const m of ['koltuk', 'hali']) wipeWs(wsOf(m), r => r.demo); commit(); toast('Örnek kayıtlar silindi'); } }),
  'reset-area': () => confirmSheet({ title: modeName(S.mode) + ' kayıtları silinsin mi?', msg: 'Bu alandaki tüm randevular, müşteriler ve giderler silinir. Diğer alan ve fiyat listeleri korunur. Geri alınamaz.', ok: 'Evet, sil', danger: true, onOk: () => { snapshotBefore(); wipeWs(ws(), () => true); commit(); toast('🗑️ Temizlendi'); } }),
  'reset-all': () => confirmSheet({ title: 'HER ŞEY silinsin mi?', msg: 'Her iki alandaki tüm kayıtlar silinir. Bu işlem geri alınamaz. Önce yedek aldığınızdan emin olun.', ok: 'Evet, hepsini sil', danger: true, onOk: () => { snapshotBefore(); for (const m of ['koltuk', 'hali']) wipeWs(wsOf(m), () => true); commit(); toast('🗑️ Tüm kayıtlar silindi'); } })
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.dataset.act === 'chem') return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.closest('.menu') && sheets.length) closeSheet(sheets[sheets.length - 1]);
  safe('act:' + el.dataset.act, () => fn(el));
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'qInput') { Q = t.value; S.ui.limit = 60; renderDList(); }
  else if (t.id === 'cqInput') { CQ = t.value; renderCList(); }
  else if (t.id === 'chemRange') { const l = $('#chemLbl'); if (l) l.textContent = '%' + t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'chemRange') { ws().chemicalStock = Math.round(num(t.value)); ws().setAt = Date.now(); commit({ noRender: true }); return; }
  if (t.id === 'backupFile') {
    const f = t.files && t.files[0]; if (!f) return;
    if (f.size > 40e6) { toast('Dosya çok büyük.'); return; }
    const rd = new FileReader(); rd.onload = () => importBackupText(String(rd.result)); rd.onerror = () => toast('Dosya okunamadı.'); rd.readAsText(f); return;
  }
  if (t.dataset.bind) {
    const path = t.dataset.bind, ty = t.dataset.t; let v = t.value;
    if (ty === 'num') { v = num(v); if (path === 'ws.monthlyTarget' && !(v > 0)) v = 100000; }
    else if (ty === 'int') v = Math.min(20, Math.max(1, Math.round(num(v)) || 4));
    else if (ty === 'pct') v = Math.min(100, Math.max(0, num(v)));
    else if (ty === 'url') { const u = safeUrl(v); if (v.trim() && !u) { toast('⚠️ Bağlantı https:// ile başlamalı.'); t.value = bindVal(path) || ''; return; } v = u; }
    else v = v.trim();
    if (path === 'business.name' && !v) v = 'KoltukTr';
    setBind(path, v); commit({ noRender: true });
    toast('✓ Kaydedildi', { ms: 1200 });
    safe('hdr', renderHeader);
    if (path === 'ws.monthlyTarget') setTimeout(() => { if (S.ui.tab === 'para' && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) renderPara(); }, 500);
    return;
  }
  if (t.dataset.svc) { const s = ws().services.find(x => x.id === t.dataset.svc); if (s) { s.price = Math.max(0, num(t.value)); t.value = s.price; ws().setAt = Date.now(); commit({ noRender: true }); toast('✓ Fiyat kaydedildi', { ms: 1200 }); } return; }
  if (t.dataset.wk) { const d = +t.dataset.wk; S.weeklyRegions[d] = { short: shortOf(t.value), full: t.value }; S.setAt = Date.now(); commit({ noRender: true }); toast('✓ Plan kaydedildi', { ms: 1200 }); }
});

/* ===== Başlatma ===== */
function init() {
  const how = loadState();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* */ }
  render();
  const total = S.workspaces.koltuk.appointments.length + S.workspaces.hali.appointments.length;
  if (how === 'eski') toast(`✅ Eski KoltukTr verileriniz aktarıldı (${S.ui.migrated} kayıt).`, { ms: 5000 });
  else if (!S.ui.onboarded && total === 0) openWelcome();
  if (cloudReady()) syncNow(false);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && cloudReady()) scheduleSync(400); });
  window.addEventListener('online', () => scheduleSync(800));
  window.addEventListener('pagehide', () => saveNow());
  window.addEventListener('storage', ev => {
    if (ev.key !== KEY || !ev.newValue) return;
    try { S = normalizeState(JSON.parse(ev.newValue), true); render(); } catch (e) { /* */ }
  });
  let day = today();
  setInterval(() => { if (today() !== day) { day = today(); render(); } }, 60000);
  if (!PREVIEW && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* çevrimdışı mod isteğe bağlı */ });
}
init();

</script>
