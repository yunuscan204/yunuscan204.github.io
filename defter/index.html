<title>KoltukTr</title>

<style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}a{color:#34d399;font-weight:700}</style>
</head>
<body>
<p>KoltukTr açılıyor… Açılmazsa <a href="../">buraya dokunun</a>.</p>
<script>
// Eski "defter" sürümünün önbelleğini ve çevrimdışı kaydını temizle, sonra ana uygulamaya geç.
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.filter(r => r.scope.indexOf('/defter/') !== -1).map(r => r.unregister()));
    }
    if (window.caches) {
      const ks = await caches.keys();
      await Promise.all(ks.filter(k => /^kt3-/.test(k)).map(k => caches.delete(k)));
    }
  } catch (e) { /* önemli değil */ }
  location.replace('../');
})();
</script>
</body>
</html>
