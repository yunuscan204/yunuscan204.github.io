<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>KoltukTr — Emlakçı &amp; Nakliyeci Partner Yönlendirme Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #090d16; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .ios-notch { height: max(env(safe-area-inset-top, 16px), 16px); }
    
        body.kobalt-pro { background-color: #f1f5f9 !important; color: #0f172a !important; }
        body.kobalt-pro .bg-slate-950 { background-color: #f8fafc !important; border-color: #dbe4f0 !important; }
        body.kobalt-pro .bg-slate-900,
        body.kobalt-pro .bg-slate-900\/40 { background-color: #ffffff !important; border-color: #dbe4f0 !important; }
        body.kobalt-pro .bg-slate-800 { background-color: #e2e8f0 !important; color: #1e293b !important; }
        body.kobalt-pro .bg-slate-800:hover { background-color: #cbd5e1 !important; }
        body.kobalt-pro .border-slate-800,
        body.kobalt-pro .border-slate-800\/80,
        body.kobalt-pro .border-slate-700 { border-color: #e2e8f0 !important; }
        body.kobalt-pro .border-emerald-700\/60,
        body.kobalt-pro .border-teal-700\/60,
        body.kobalt-pro .border-amber-700\/60 { border-color: #bfdbfe !important; }
        body.kobalt-pro .bg-emerald-950,
        body.kobalt-pro .bg-emerald-950\/60,
        body.kobalt-pro .bg-emerald-950\/70,
        body.kobalt-pro .bg-emerald-950\/40,
        body.kobalt-pro .bg-emerald-900 { background-color: #eff6ff !important; border-color: #bfdbfe !important; color: #1e40af !important; }
        body.kobalt-pro .bg-teal-950 { background-color: #eff6ff !important; border-color: #bfdbfe !important; color: #1d4ed8 !important; }
        body.kobalt-pro .bg-amber-950 { background-color: #fffbeb !important; border-color: #fde68a !important; color: #92400e !important; }
        body.kobalt-pro .bg-rose-950 { background-color: #fff1f2 !important; border-color: #fecdd3 !important; color: #9f1239 !important; }
        body.kobalt-pro .text-white { color: #0f172a !important; }
        body.kobalt-pro .text-slate-300 { color: #334155 !important; }
        body.kobalt-pro .text-slate-400,
        body.kobalt-pro .text-slate-500 { color: #64748b !important; }
        body.kobalt-pro .text-emerald-200,
        body.kobalt-pro .text-emerald-300,
        body.kobalt-pro .text-emerald-400 { color: #047857 !important; }
        body.kobalt-pro .text-teal-300,
        body.kobalt-pro .text-teal-400 { color: #1d4ed8 !important; }
        body.kobalt-pro .text-amber-300 { color: #b45309 !important; }
        body.kobalt-pro .text-rose-200 { color: #be123c !important; }
        body.kobalt-pro .bg-emerald-600,
        body.kobalt-pro .bg-teal-600 { background-color: #2563eb !important; color: #ffffff !important; }
        body.kobalt-pro .bg-emerald-600:hover,
        body.kobalt-pro .bg-teal-600:hover { background-color: #1d4ed8 !important; }
        body.kobalt-pro .bg-emerald-600 *,
        body.kobalt-pro .bg-teal-600 * { color: #ffffff !important; }
        body.kobalt-pro input,
        body.kobalt-pro select,
        body.kobalt-pro textarea { background-color: #ffffff !important; color: #0f172a !important; border-color: #cbd5e1 !important; }
        body.kobalt-pro input:focus,
        body.kobalt-pro select:focus { border-color: #2563eb !important; outline: none !important; box-shadow: 0 0 0 2px rgba(37,99,235,0.15) !important; }

    </style>
</head>
<body class="kobalt-pro min-h-screen p-4 pb-10">
    <div class="ios-notch"></div>
    <div class="max-w-md mx-auto bg-slate-900 border border-amber-700/60 rounded-3xl p-5 space-y-4 shadow-2xl">
        <div class="border-b border-slate-800 pb-3">
            <span class="text-[10px] bg-amber-950 text-amber-300 border border-amber-700 px-2 py-0.5 rounded-full font-extrabold">EMLAKÇI / NAKLİYECİ / SİTE GÖREVLİSİ PORTALI</span>
            <h1 id="ptBizName" class="text-lg font-extrabold text-white mt-1">Hızlı Müşteri Yönlendirme</h1>
            <p class="text-[11px] text-slate-400 mt-0.5">Yeni taşınan veya temizlik isteyen müşteriyi 10 saniyede iletin, her tamamlanan işten %10 prim kazanın.</p>
        </div>

        <div id="ptStatusBox" class="hidden rounded-xl p-2.5 text-xs font-bold"></div>

        <div class="space-y-2.5 text-xs">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-amber-300 font-bold">Sizin Adınız / Ofisiniz *</label>
                    <input type="text" id="ptPartnerName" placeholder="Örn: Kaya Emlak" class="w-full bg-slate-950 border border-amber-700/60 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="text-[10px] text-amber-300 font-bold">Sizin Telefonunuz *</label>
                    <input type="tel" id="ptPartnerPhone" placeholder="05XX XXX XX XX" class="w-full bg-slate-950 border border-amber-700/60 rounded-xl p-2.5 text-white">
                </div>
            </div>

            <div class="border-t border-slate-800 pt-2.5 space-y-2">
                <div class="text-[10px] font-extrabold text-emerald-400 uppercase">👤 Yönlendirilen Müşteri Bilgileri</div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="ptCustName" placeholder="Müşteri Adı Soyadı *" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                    <input type="tel" id="ptCustPhone" placeholder="Müşteri Telefonu *" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="ptServiceType" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white font-bold">
                        <option value="Koltuk Yıkama">🛋️ Koltuk Yıkama</option>
                        <option value="Halı Yıkama">🧶 Halı Yıkama</option>
                        <option value="Koltuk + Halı + Yatak">✨ Komple Ev Paketi</option>
                    </select>
                    <input type="text" id="ptDistrict" placeholder="İlçe / Mahalle" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                </div>
                <input type="text" id="ptAddress" placeholder="Site / Apartman Adı ve Kısa Not..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
            </div>

            <button type="button" onclick="submitPartnerLead()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-extrabold py-3.5 rounded-2xl shadow-lg text-sm">
                🚀 Müşteriyi Yönlendir &amp; WhatsApp Bildir
            </button>
        </div>
    </div>

    <script>
        const FB_URL = "https://koltuktr-7f600-default-rtdb.europe-west1.firebasedatabase.app";
        let teamCode = "", bizPhone = "", bizName = "Son Sistem Koltuk";

        function showStatus(msg, isErr = false) {
            const b = document.getElementById("ptStatusBox");
            b.textContent = msg;
            b.className = isErr ? "rounded-xl p-2.5 text-xs font-bold bg-rose-950 border border-rose-500 text-rose-200" : "rounded-xl p-2.5 text-xs font-bold bg-emerald-950 border border-emerald-500 text-emerald-200";
            b.classList.remove("hidden");
        }

        async function submitPartnerLead() {
            const pName = document.getElementById("ptPartnerName").value.trim();
            const pPhone = document.getElementById("ptPartnerPhone").value.trim();
            const cName = document.getElementById("ptCustName").value.trim();
            const cPhone = document.getElementById("ptCustPhone").value.trim();
            const srv = document.getElementById("ptServiceType").value;
            const dist = document.getElementById("ptDistrict").value.trim();
            const addr = document.getElementById("ptAddress").value.trim();

            if (!pName || !cName || !cPhone) {
                showStatus("⚠️ Lütfen kendi adınızı ve yönlendirdiğiniz müşterinin adı ile telefonunu yazın.", true);
                return;
            }

            const leadId = "lead_" + Date.now();
            const leadObj = {
                id: leadId,
                partnerName: pName,
                partnerPhone: pPhone,
                customerName: cName,
                customerPhone: cPhone,
                serviceType: srv,
                district: dist,
                address: addr,
                status: "new",
                createdAt: new Date().toISOString().slice(0, 10)
            };

            let savedToCloud = false;
            if (teamCode) {
                try {
                    const r = await fetch(`${FB_URL}/koltuktr_teams/${encodeURIComponent(teamCode)}/partner_leads/${leadId}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(leadObj)
                    });
                    savedToCloud = !!(r && r.ok);
                } catch (e) {}
            }

            showStatus(savedToCloud
                ? "✅ Yönlendirme sisteme kaydedildi! WhatsApp bildirimi açılıyor..."
                : "💬 Yönlendirme hazır! WhatsApp bildirimi açılıyor...", false);
            let bp = String(bizPhone || "").replace(/\D/g, "");
            if (bp.startsWith("0")) bp = "90" + bp.slice(1);
            else if (bp.length === 10) bp = "90" + bp;
            const msg = `🤝 *Partner Müşteri Yönlendirmesi*\n🏢 Gönderen: *${pName}* (${pPhone})\n👤 Müşteri: *${cName}* (${cPhone})\n🧼 Talep: ${srv}\n📍 Konum: ${dist} ${addr}`;
            window.open(bp ? `https://wa.me/${bp}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
            document.getElementById("ptCustName").value = "";
            document.getElementById("ptCustPhone").value = "";
            document.getElementById("ptAddress").value = "";
        }

        window.addEventListener("DOMContentLoaded", () => {
            const p = new URLSearchParams(window.location.search);
            teamCode = (p.get("t") || "").trim().toUpperCase().replace(/[^A-Z0-9_-]/g, "");
            bizPhone = (p.get("ph") || "").trim();
            bizName = (p.get("b") || "KoltukTr Partner").trim();
            const pn = (p.get("p") || "").trim();
            if (pn) document.getElementById("ptPartnerName").value = pn;
            document.getElementById("ptBizName").textContent = `${bizName} — Partner Portalı`;
        });
    </script>
</body>
</html>
