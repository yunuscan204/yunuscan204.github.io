<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>KoltukTr — Canlı Sipariş Takip Ekranı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #090d16; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .ios-notch { height: max(env(safe-area-inset-top, 16px), 16px); }
    
        body.kobalt-pro { background-color: #f1f5f9 !important; color: #0f172a !important; }
        body.kobalt-pro .bg-slate-950 { background-color: #f8fafc !important; border-color: #dbe4f0 !important; }
        body.kobalt-pro .bg-slate-900,
        body.kobalt-pro .bg-slate-900\/40 { background-color: #ffffff !important; border-color: #dbe4f0 !important; }
        body.kobalt-pro .bg-slate-800 { background-color: #e2e8f0 !important; color: #1e293b !important; }
        body.kobalt-pro .bg-slate-800:hover { background-color: #cbd5e1 !important; }
        body.kobalt-pro .border-slate-800,
        body.kobalt-pro .border-slate-800\/80,
        body.kobalt-pro .border-slate-700 { border-color: #e2e8f0 !important; }
        body.kobalt-pro .border-emerald-700\/60,
        body.kobalt-pro .border-teal-700\/60,
        body.kobalt-pro .border-amber-700\/60 { border-color: #bfdbfe !important; }
        body.kobalt-pro .bg-emerald-950,
        body.kobalt-pro .bg-emerald-950\/60,
        body.kobalt-pro .bg-emerald-950\/70,
        body.kobalt-pro .bg-emerald-950\/40,
        body.kobalt-pro .bg-emerald-900 { background-color: #eff6ff !important; border-color: #bfdbfe !important; color: #1e40af !important; }
        body.kobalt-pro .bg-teal-950 { background-color: #eff6ff !important; border-color: #bfdbfe !important; color: #1d4ed8 !important; }
        body.kobalt-pro .bg-amber-950 { background-color: #fffbeb !important; border-color: #fde68a !important; color: #92400e !important; }
        body.kobalt-pro .bg-rose-950 { background-color: #fff1f2 !important; border-color: #fecdd3 !important; color: #9f1239 !important; }
        body.kobalt-pro .text-white { color: #0f172a !important; }
        body.kobalt-pro .text-slate-300 { color: #334155 !important; }
        body.kobalt-pro .text-slate-400,
        body.kobalt-pro .text-slate-500 { color: #64748b !important; }
        body.kobalt-pro .text-emerald-200,
        body.kobalt-pro .text-emerald-300,
        body.kobalt-pro .text-emerald-400 { color: #047857 !important; }
        body.kobalt-pro .text-teal-300,
        body.kobalt-pro .text-teal-400 { color: #1d4ed8 !important; }
        body.kobalt-pro .text-amber-300 { color: #b45309 !important; }
        body.kobalt-pro .text-rose-200 { color: #be123c !important; }
        body.kobalt-pro .bg-emerald-600,
        body.kobalt-pro .bg-teal-600 { background-color: #2563eb !important; color: #ffffff !important; }
        body.kobalt-pro .bg-emerald-600:hover,
        body.kobalt-pro .bg-teal-600:hover { background-color: #1d4ed8 !important; }
        body.kobalt-pro .bg-emerald-600 *,
        body.kobalt-pro .bg-teal-600 * { color: #ffffff !important; }
        body.kobalt-pro input,
        body.kobalt-pro select,
        body.kobalt-pro textarea { background-color: #ffffff !important; color: #0f172a !important; border-color: #cbd5e1 !important; }
        body.kobalt-pro input:focus,
        body.kobalt-pro select:focus { border-color: #2563eb !important; outline: none !important; box-shadow: 0 0 0 2px rgba(37,99,235,0.15) !important; }

    </style>
</head>
<body class="kobalt-pro min-h-screen p-4 pb-10">
    <div class="ios-notch"></div>
    <div class="max-w-md mx-auto bg-slate-900 border border-teal-700/60 rounded-3xl p-5 space-y-4 shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
                <span class="text-[10px] bg-teal-950 text-teal-300 border border-teal-700 px-2 py-0.5 rounded-full font-extrabold">CANLI SİPARİŞ TAKİP</span>
                <h1 id="tkBizName" class="text-lg font-extrabold text-white mt-1">KoltukTr Sipariş Takip</h1>
            </div>
            <button onclick="loadTrackingInfo()" class="bg-slate-800 hover:bg-slate-700 text-teal-300 text-xs font-bold px-3 py-2 rounded-xl">🔄 Yenile</button>
        </div>

        <div id="tkManualBox" class="hidden bg-slate-950 border border-slate-800 rounded-2xl p-3 space-y-2 text-xs">
            <div class="text-slate-300 font-bold">Ekip Kodu ve Sipariş Fiş Kodunu Girin:</div>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="tkTeamInp" placeholder="Ekip Kodu (KTR-...)" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white uppercase font-mono">
                <input type="text" id="tkOrderInp" placeholder="Sipariş ID (apt_...)" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white font-mono">
            </div>
            <button onclick="manualLoadTracking()" class="w-full bg-teal-600 text-white font-extrabold py-2 rounded-xl">🔍 Siparişi Sorgula</button>
        </div>

        <div id="tkLoading" class="text-center py-8 text-xs text-slate-400">⏳ Sipariş durumu yükleniyor...</div>
        <div id="tkError" class="hidden bg-rose-950 border border-rose-600 text-rose-200 rounded-2xl p-4 text-xs font-bold text-center"></div>

        <div id="tkContent" class="hidden space-y-4">
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-1 text-xs">
                <div class="flex justify-between items-center">
                    <span class="font-extrabold text-teal-300" id="tkReceiptNo">#H-101</span>
                    <span class="text-[11px] text-slate-400" id="tkDate">—</span>
                </div>
                <div class="text-base font-extrabold text-white" id="tkCustName">—</div>
                <div class="text-emerald-300 font-semibold" id="tkServices">—</div>
                <div class="text-[11px] text-slate-400" id="tkShelfInfo"></div>
            </div>

            <!-- Kargo Tipi Canlı Aşama Çizgisi -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                <div class="text-[10px] font-extrabold text-teal-400 uppercase">🚚 Sipariş Aşaması</div>
                <div id="tkStagesList" class="space-y-2"></div>
            </div>

            <!-- Ödeme Özeti -->
            <div class="bg-emerald-950/40 border border-emerald-700/60 rounded-2xl p-3.5 flex justify-between items-center text-xs">
                <div>
                    <div class="text-slate-300">Toplam: <strong class="text-white" id="tkTotalPrice">0 ₺</strong></div>
                    <div class="text-[11px] text-emerald-300" id="tkPaidStatus">—</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-amber-300 font-bold">Kalan Tutar</div>
                    <div class="text-lg font-extrabold text-white" id="tkRemPrice">0 ₺</div>
                </div>
            </div>

            <!-- Fotoğraflar (Varsa) -->
            <div id="tkPhotosBox" class="hidden grid grid-cols-2 gap-2">
                <div id="tkBeforeWrap" class="hidden bg-slate-950 border border-slate-800 rounded-2xl p-2 text-center">
                    <div class="text-[10px] font-bold text-amber-300 mb-1">ÖNCESİ</div>
                    <img id="tkBeforeImg" class="w-full h-32 object-cover rounded-xl" alt="Öncesi">
                </div>
                <div id="tkAfterWrap" class="hidden bg-slate-950 border border-slate-800 rounded-2xl p-2 text-center">
                    <div class="text-[10px] font-bold text-emerald-300 mb-1">SONRASI ✨</div>
                    <img id="tkAfterImg" class="w-full h-32 object-cover rounded-xl" alt="Sonrası">
                </div>
            </div>

            <a id="tkWaBtn" href="#" target="_blank" class="block w-full text-center bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-2xl shadow-lg text-sm">
                💬 İşletmeye WhatsApp'tan Yaz
            </a>
        </div>
    </div>

    <script>
        const FB_URL = "https://koltuktr-7f600-default-rtdb.europe-west1.firebasedatabase.app";
        const STAGES = [
            { key: "Teslim Alındı", icon: "📦", desc: "Siparişiniz ekibimiz tarafından teslim alındı." },
            { key: "Yıkamada", icon: "🫧", desc: "Antibakteriyel derin yıkama işlemi uygulanıyor." },
            { key: "Kurutmada", icon: "🌬️", desc: "Özel kurutma ve hijyen kontrolü aşamasında." },
            { key: "Dağıtımda", icon: "🚚", desc: "Siparişiniz teslimat aracımıza yüklendi, yolda!" },
            { key: "Teslim Edildi", icon: "✅", desc: "Siparişiniz teslim edildi. Güzel günlerde kullanın!" }
        ];
        let activeTeam = "", activeOrder = "";

        function escHtml(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

        function manualLoadTracking() {
            activeTeam = (document.getElementById("tkTeamInp").value || "").trim().toUpperCase().replace(/[^A-Z0-9_-]/g, "");
            activeOrder = (document.getElementById("tkOrderInp").value || "").trim();
            loadTrackingInfo();
        }

        async function loadTrackingInfo() {
            const loadEl = document.getElementById("tkLoading");
            const errEl = document.getElementById("tkError");
            const contEl = document.getElementById("tkContent");
            errEl.classList.add("hidden");
            if (!activeTeam || !activeOrder) {
                loadEl.classList.add("hidden");
                document.getElementById("tkManualBox").classList.remove("hidden");
                return;
            }
            loadEl.classList.remove("hidden");
            contEl.classList.add("hidden");
            try {
                const res = await fetch(`${FB_URL}/koltuktr_teams/${encodeURIComponent(activeTeam)}/public_track/${encodeURIComponent(activeOrder)}.json`);
                if (!res.ok) throw new Error("HTTP " + res.status);
                const d = await res.json();
                if (!d || typeof d !== "object") {
                    loadEl.classList.add("hidden");
                    errEl.textContent = "❌ Sipariş kaydı bulunamadı. Lütfen linki kontrol edin.";
                    errEl.classList.remove("hidden");
                    document.getElementById("tkManualBox").classList.remove("hidden");
                    return;
                }

                document.getElementById("tkBizName").textContent = d.businessName || "KoltukTr";
                document.getElementById("tkReceiptNo").textContent = d.receiptNo || "#101";
                document.getElementById("tkDate").textContent = d.date || "";
                document.getElementById("tkCustName").textContent = d.customerName || "Değerli Müşterimiz";
                document.getElementById("tkServices").textContent = d.servicesText || "Genel Yıkama";
                document.getElementById("tkShelfInfo").textContent = d.shelfCode ? `🏷️ Atölye Raf Konumu: ${d.shelfCode}` : (d.vehicle ? `🚐 Görevli Ekip: ${d.vehicle}` : "");

                const curIdx = Math.max(0, STAGES.findIndex(s => s.key === d.stage));
                const list = document.getElementById("tkStagesList");
                list.innerHTML = "";
                STAGES.forEach((st, idx) => {
                    const done = idx < curIdx;
                    const curr = idx === curIdx;
                    const row = document.createElement("div");
                    row.className = `p-2.5 rounded-xl border flex items-center space-x-2.5 ${curr ? 'bg-emerald-950/70 border-emerald-500' : (done ? 'bg-slate-900 border-emerald-800/50' : 'bg-slate-900/40 border-slate-800 opacity-50')}`;
                    row.innerHTML = `
                        <div class="w-8 h-8 rounded-xl flex items-center justify-center text-sm shrink-0 ${curr ? 'bg-emerald-600 text-white' : (done ? 'bg-emerald-900 text-emerald-300' : 'bg-slate-800 text-slate-400')}">${done ? '✓' : st.icon}</div>
                        <div class="min-w-0">
                            <div class="text-xs font-extrabold ${curr ? 'text-white' : (done ? 'text-emerald-300' : 'text-slate-400')}">${st.key} ${curr ? '(Şu An Burada)' : ''}</div>
                            <div class="text-[10px] text-slate-400">${st.desc}</div>
                        </div>
                    `;
                    list.appendChild(row);
                });

                const tot = Number(d.price || 0);
                const rem = Math.max(0, Number(d.remaining || 0));
                document.getElementById("tkTotalPrice").textContent = `${tot.toLocaleString("tr-TR")} ₺`;
                document.getElementById("tkRemPrice").textContent = `${rem.toLocaleString("tr-TR")} ₺`;
                document.getElementById("tkPaidStatus").textContent = rem === 0 ? "✅ Ödeme Tamamlandı" : "⏳ Teslimatta / Kalan Bakiye";

                // Öncesi/Sonrası fotoğraf önizlemesi (public_track üzerinden güvenli okuma)
                document.getElementById("tkPhotosBox").classList.add("hidden");
                document.getElementById("tkBeforeWrap").classList.add("hidden");
                document.getElementById("tkAfterWrap").classList.add("hidden");
                const isSafeImg = s => typeof s === "string" && /^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(s.trim());
                const safeBefore = isSafeImg(d.beforePhoto) ? d.beforePhoto.trim() : "";
                const safeAfter = isSafeImg(d.afterPhoto) ? d.afterPhoto.trim() : "";
                if (safeBefore || safeAfter) {
                    document.getElementById("tkPhotosBox").classList.remove("hidden");
                    if (safeBefore) { document.getElementById("tkBeforeImg").src = safeBefore; document.getElementById("tkBeforeWrap").classList.remove("hidden"); }
                    if (safeAfter) { document.getElementById("tkAfterImg").src = safeAfter; document.getElementById("tkAfterWrap").classList.remove("hidden"); }
                }

                let bp = String(d.businessPhone || "").replace(/\D/g, "");
                if (bp.startsWith("0")) bp = "90" + bp.slice(1);
                else if (bp.length === 10) bp = "90" + bp;
                const waMsg = `Merhaba, ${d.receiptNo || ''} fiş numaralı siparişim hakkında bilgi almak istiyorum.`;
                document.getElementById("tkWaBtn").href = bp ? `https://wa.me/${bp}?text=${encodeURIComponent(waMsg)}` : `https://wa.me/?text=${encodeURIComponent(waMsg)}`;

                loadEl.classList.add("hidden");
                contEl.classList.remove("hidden");
            } catch (err) {
                loadEl.classList.add("hidden");
                errEl.textContent = "❌ Bağlantı hatası oluştu. İnternetinizi kontrol edip tekrar deneyin.";
                errEl.classList.remove("hidden");
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const p = new URLSearchParams(window.location.search);
            activeTeam = (p.get("t") || "").trim().toUpperCase().replace(/[^A-Z0-9_-]/g, "");
            activeOrder = (p.get("f") || "").trim();
            if (activeTeam) document.getElementById("tkTeamInp").value = activeTeam;
            if (activeOrder) document.getElementById("tkOrderInp").value = activeOrder;
            loadTrackingInfo();
        });
    </script>
</body>
</html>
